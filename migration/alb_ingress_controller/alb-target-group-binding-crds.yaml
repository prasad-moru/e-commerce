apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: targetgroupbindings.elbv2.k8s.aws
spec:
  group: elbv2.k8s.aws
  names:
    kind: TargetGroupBinding
    plural: targetgroupbindings
    singular: targetgroupbinding
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetGroupARN:
                  type: string
                targetType:
                  type: string
                  enum:
                    - instance
                    - ip
                serviceRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    port:
                      anyOf:
                        - type: integer
                        - type: string
                networking:
                  type: object
                  properties:
                    ingress:
                      type: array
                      items:
                        type: object
                        properties:
                          from:
                            type: array
                            items:
                              type: object
                              properties:
                                ipBlock:
                                  type: object
                                  properties:
                                    cidr:
                                      type: string
                                securityGroup:
                                  type: object
                                  properties:
                                    groupID:
                                      type: string
                          ports:
                            type: array
                            items:
                              type: object
                              properties:
                                port:
                                  anyOf:
                                    - type: integer
                                    - type: string
                                protocol:
                                  type: string
              required:
                - targetGroupARN
                - serviceRef
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
      subresources:
        status: {}
