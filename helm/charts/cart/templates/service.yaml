apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
  selector:
    {{- include "cart.selectorLabels" . | nindent 4 }}