apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "search.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
  selector:
    {{- include "search.selectorLabels" . | nindent 4 }}